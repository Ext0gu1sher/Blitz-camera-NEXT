<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blitz Camera · 悬浮摄影面板</title><link rel="stylesheet" href="/overlay.css"><link rel="stylesheet" href="/overlay-controls.css"><link rel="stylesheet" href="/replay-open.css"><link rel="stylesheet" href="/number-field.css"><script src="/preview-time.js" defer></script><script src="/overlay-preview.js" defer></script><script src="/number-field.js" defer></script><script src="/overlay.js" defer></script></head>
<body>
  <div id="browserNote" hidden>悬浮面板浏览预览 · 真正的透明置顶需要桌面外壳。<a href="/">返回工作台</a></div>
  <main>
    <section data-panel="connection" hidden>
      <h1 class="browser-heading">连接回放</h1>
      <div class="connection-line"><span id="connectionDot" class="dot"></span><strong id="connectionLabel">读取服务…</strong><span id="replaySummary" class="muted"></span><span class="spacer"></span><button id="openReplay" class="primary" disabled>打开回放…</button><button id="connectToggle" disabled>连接</button><button id="stop" class="danger" hidden>停止接管</button><button id="workbench">工作台 ↗</button><button id="settingsToggle" aria-expanded="false">设置</button><button id="hide" title="Ctrl+Alt+F9 显示/隐藏">隐藏</button></div>
      <p id="statusLine" class="message">等待本地服务。</p>
      <div id="settings" hidden><label>底色 <input id="opacity" type="range" min="45" max="95" value="80"><output id="opacityValue">80%</output></label><label>显隐 Ctrl+Alt+<select id="hideKey"><option>F7</option><option>F8</option><option selected>F9</option><option>F10</option><option>F11</option><option>F12</option></select></label><label>记录 Ctrl+Alt+<select id="captureKey"><option>F7</option><option selected>F8</option><option>F9</option><option>F10</option><option>F11</option><option>F12</option></select></label><button id="saveKeys">应用</button><button id="reset">重置布局</button></div>
    </section>
    <section data-panel="telemetry" hidden>
      <h1 class="browser-heading">实时数据</h1>
      <div class="readout"><span class="muted">战斗回放时间</span><strong id="replayTime">—</strong><span id="replayMode" class="tag">未读取</span></div>
      <div class="row-label">世界坐标 <span id="dataQuality">等待读取</span></div>
      <dl class="values"><div><dt class="x">X</dt><dd id="x">—</dd></div><div><dt class="y">Y</dt><dd id="y">—</dd></div><div><dt class="z">Z</dt><dd id="z">—</dd></div></dl>
      <dl class="values angles"><div><dt>摄像机水平角度</dt><dd id="yaw">—</dd></div><div><dt>俯仰</dt><dd id="pitch">—</dd></div><div><dt>横滚</dt><dd id="roll">—</dd></div></dl>
      <div class="fov"><span>缩放</span><strong id="fov">—</strong></div>
    </section>
    <section data-panel="capture" hidden>
      <h1 class="browser-heading">记录属性关键帧</h1>
      <div class="capture-time"><span class="capture-label">当前对局时间</span><span class="capture-field"><input id="captureTime" type="number" min="0" step="0.001" data-scrub-step="0.016667" value="0" readonly><span class="muted">s</span></span></div>
      <label class="check"><input type="checkbox" id="replace">替换同一时刻的关键帧</label>
      <button id="capture" class="primary wide" disabled title="记录 X · Y · Z · 摄像机水平角度 · 俯仰 · 横滚 · 缩放">◆ 记录关键帧</button>
      <p id="captureHint"></p>
    </section>
    <section data-panel="keyframes" hidden>
      <h1 class="browser-heading">轨迹预览 · 播放</h1>
      <div class="mini-preview-heading"><strong>轨迹预览</strong><div class="mini-views" role="group" aria-label="轨迹预览视图"><button data-view="3d" aria-pressed="true">3D</button><button data-view="xy" aria-pressed="false">XY</button><button data-view="xz" aria-pressed="false">XZ</button><button id="miniFit" aria-label="重置轨迹视角">⌗</button></div></div>
      <canvas id="miniCanvas" title="拖动旋转 · 滚轮缩放 · Shift 拖动平移 · 双击复位" aria-label="离线轨迹预览；显示保存的路径和相机方向"></canvas>
      <div class="mini-preview-controls"><button id="miniPreview" disabled>▶ 预览</button><span id="miniTime">0.00 / 0.00 s</span></div>
      <input id="miniSlider" aria-label="离线轨迹预览进度，不跳转游戏回放" type="range" min="0" max="1" step="0.001" value="0" disabled>
      <div class="mini-speed-heading"><strong>战斗速度预览</strong><span id="speedModeLabel">战斗保持暂停</span></div>
      <svg id="miniSpeedGraph" role="img" aria-label="战斗回放速度曲线；横轴为拍摄进度，纵轴为回放倍率"></svg>
      <div id="miniSpeedReadout" class="mini-speed-readout">0.000× · 拍摄 0.00 s · 战斗 +0.00 s</div>
      <div class="mini-duration"><label for="pathDuration">整段时长 <span id="clockLabel">拍摄秒</span></label><input id="pathDuration" type="number" min="0.5" max="120" step="0.1" value="8"></div>
      <div class="mini-live-buttons"><button id="liveForward" class="primary" disabled>▶ 正向播放</button><button id="liveSeekStart" title="实验性跳转到工作区入点 · 游戏需暂停；可能导致客户端崩溃">⤒ 入点</button><button id="liveReverse" disabled>◀ 反向</button><button id="liveStop" class="danger" disabled>■ 停止</button></div>
      <div id="miniLiveStatus" role="status">预览不移动游戏；播放按钮会接管镜头。</div>
      <progress id="miniProgress" max="1" value="0" aria-label="游戏内轨迹播放进度"></progress>
      <p class="attribute-summary" id="attributeSummary">七条摄像机属性轨道</p>
    </section>
  </main>
  <div id="toast" role="status" hidden></div>
</body></html>
